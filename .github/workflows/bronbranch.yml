name: bronbranch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  bronbranch:
    runs-on: ubuntu-latest
    steps:
      - name: Alleen testing mag naar main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "testing" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests naar main moeten van de branch testing komen (nu: $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Bron is testing."
