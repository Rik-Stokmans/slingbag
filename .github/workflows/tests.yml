name: tests

# Draait bij elke pull request naar main en als eerste stap van beta.yml en release.yml.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # gelijk aan Raspberry Pi OS Bookworm
      - run: pip install flask waitress pytest
      - run: python -m pytest -q
      - name: Shellscripts controleren
        run: for f in install.sh deploy/*.sh; do bash -n "$f"; done
